name: VERITAS-ID Daily Cloud Crawler & Gmail Notifier

on:
  schedule:
    # Runs every day at 01:00 UTC (which is 08:00 AM WIB)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-daily-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 scikit-learn pandas numpy tensorflow

      - name: Execute Daily Scraping, Retraining & Email Report
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python daily_scheduler.py

      - name: Commit and Push Updated Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/fact_check.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Update fact_check.db from daily cloud crawler [skip ci]" && git pull --rebase && git push)

